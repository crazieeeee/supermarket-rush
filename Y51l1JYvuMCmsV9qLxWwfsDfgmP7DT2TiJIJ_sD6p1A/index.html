<style>

  .pos { color: var(--green); }
  .neg { color: var(--red); }
  section { margin-bottom: 26px; }
  .sh { font-size: .72rem; color: var(--muted); letter-spacing: .05em; margin-bottom: 12px; }

  .br .sym { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; background: #4a7fb5; border-radius: 99px; min-width: 2px; }
  .fill.other { background: #3a4454; }
  .pct { font-family: var(--mono); font-size: .72rem; color: var(--muted); text-align: right; }

  .mv .s { font-weight: 600; }
  .pies { display: grid; gap: 20px; }
  .pie-card { display: grid; grid-template-columns: 108px 1fr; gap: 12px; align-items: center; }
  .pie-card svg { width: 108px; height: 108px; display: block; }
  .legend { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .leg { display: grid; grid-template-columns: 8px 1fr auto; gap: 7px; align-items: center; font-size: .74rem; }
  .leg i { width: 8px; height: 8px; border-radius: 2px; display: block; }
  .leg .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
  .leg .p { font-family: var(--mono); font-size: .68rem; color: var(--muted); }
  details.positions { border-top: 1px solid var(--line); padding-top: 14px; }
  details.positions > summary {
    list-style: none; cursor: pointer; font-size: .84rem; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center; user-select: none;
    padding: 4px 0 12px;
  }
  details.positions > summary::-webkit-details-marker { display: none; }
  details.positions > summary::after { content: "＋"; font-size: .9rem; color: var(--muted); }
  details.positions[open] > summary::after { content: "－"; }
  .tbl { width: 100%; border-collapse: collapse; font-size: .72rem; }
  .tbl th { color: var(--muted); font-weight: 500; text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .tbl td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl .sym { font-weight: 650; font-size: .78rem; }
  .tbl .desc { color: var(--muted); font-size: .65rem; font-weight: 400; display: block; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foot { margin-top: 28px; font-size: .65rem; color: var(--muted); line-height: 1.45; }

ct": 2.486295244137161}, {"label": "韓國", "marketValueBase": 15090.9, "pct": 1.1518990756649068}], "assetClass": [{"label": "股票", "marketValueBase": 679584.083995, "pct": 51.87313402053044}, {"label": "ETF", "marketValueBase": 592621.9456549999, "pct": 45.23525246464645}, {"label": "債券", "marketValueBase": 37882.702845, "pct": 2.8916135148230944}]}}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("portfolio-data").textContent);
  const base = D.equity.currency || D.meta.baseCurrency || "HKD";
  const nf0 = new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nfFull = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const COLORS = ["#5b9fd4","#3ecf8e","#e6c07b","#c678dd","#56b6c2","#f2555a","#61afef","#98c379","#d19a66","#7d8796"];

  function money(n, mode) {
    if (n == null || Number.isNaN(+n)) return "—";
    if (mode === "full") return nfFull.format(n);
    if (mode === "qty") return Number.isInteger(+n) ? nf0.format(n) : nf2.format(n);
    const a = Math.abs(n);
    if (a >= 1e4) return nf0.format(Math.round(n));
    return nf2.format(n);
  }
  function signed(n, mode) {
    if (n == null || Number.isNaN(+n)) return "—";
    const t = (n > 0 ? "+" : "") + money(n, mode || "full");
    return `<span class="${n > 0 ? "pos" : n < 0 ? "neg" : ""}">${t}</span>`;
  }
  function signedPct(n) {
    if (n == null || Number.isNaN(+n)) return "—";
    const t = (n > 0 ? "+" : "") + nf2.format(n) + "%";
    return `<span class="${n > 0 ? "pos" : n < 0 ? "neg" : ""}">${t}</span>`;
  }
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }

  function polar(cx, cy, r, angleDeg) {
    const a = (angleDeg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }
  function donutSVG(items) {
    const cx = 54, cy = 54, r = 46, ir = 28;
    let angle = 0;
    const total = items.reduce((s, x) => s + x.pct, 0) || 1;
    const parts = [];
    items.forEach((it, i) => {
      const sweep = it.pct / total * 360;
      if (sweep <= 0) return;
      const large = sweep > 180 ? 1 : 0;
      const [x1, y1] = polar(cx, cy, r, angle);
      const [x2, y2] = polar(cx, cy, r, angle + sweep);
      const [x3, y3] = polar(cx, cy, ir, angle + sweep);
      const [x4, y4] = polar(cx, cy, ir, angle);
      const color = COLORS[i % COLORS.length];
      // Full circle special-case
      if (sweep >= 359.9) {
        parts.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" />`);
        parts.push(`<circle cx="${cx}" cy="${cy}" r="${ir}" fill="var(--bg)" />`);
      } else {
        parts.push(`<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${ir} ${ir} 0 ${large} 0 ${x4} ${y4} Z" fill="${color}" />`);
      }
      angle += sweep;
    });
    return `<svg viewBox="0 0 108 108" aria-hidden="true">${parts.join("")}</svg>`;
  }
  function pieCard(title, items) {
    if (!items || !items.length) return "";
    const legend = items.map((it, i) => `
      <div class="leg">
        <i style="background:${COLORS[i % COLORS.length]}"></i>
        <span class="n">${esc(it.label)}</span>
        <span class="p">${it.pct.toFixed(1)}%</span>
      </div>`).join("");
    return `<div>
      <div class="sh" style="margin-bottom:10px">${esc(title)}</div>
      <div class="pie-card">${donutSVG(items)}<div class="legend">${legend}</div></div>
    </div>`;
  }

  document.getElementById("who").textContent = D.meta.accountName || "";
  document.getElementById("when").textContent = "結單 " + (D.meta.statementTo || "—");

  const eq = D.equity;
  document.getElementById("nav").innerHTML = money(eq.total, "full") + `<span class="ccy">${esc(base)}</span>`;
  const twr = (D.changeInNav || {}).twr;
  const mtm = (D.changeInNav || {}).mtm;
  document.getElementById("day").innerHTML =
    signedPct(twr) + ` <span style="color:var(--muted);font-size:.82rem">${signed(mtm, "full")} 日內</span>`;

  document.getElementById("upnl").innerHTML = signed(D.totals.unrealizedPnlBase, "full");
  const cash = eq.cash;
  document.getElementById("cash").innerHTML = `<span class="${cash < 0 ? "neg" : cash > 0 ? "pos" : ""}">${money(cash, "full")}</span>`;
  document.getElementById("cashHint").textContent = cash < 0 ? "保證金欠款（淨額）" : "淨現金";

  const A = D.allocations || {};
  document.getElementById("pies").innerHTML =
    pieCard("資產種類", A.assetClass) +
    pieCard("地區", A.region) +
    pieCard("行業", A.sector);

  const TOP_N = 6;
  const ranked = D.positions.slice().sort((a, b) => b.weightPct - a.weightPct);
  const top = ranked.slice(0, TOP_N);
  const rest = ranked.slice(TOP_N);
  const otherPct = rest.reduce((s, p) => s + p.weightPct, 0);
  const rows = top.map(p => ({ sym: p.symbol, pct: p.weightPct, other: false }));
  if (otherPct > 0.05) rows.push({ sym: "其他", pct: otherPct, other: true });
  const maxP = Math.max(...rows.map(r => r.pct), 1);
  document.getElementById("weights").innerHTML = rows.map(r => `
    <div class="br">
      <div class="sym">${esc(r.sym)}</div>
      <div class="track"><div class="fill${r.other ? " other" : ""}" style="width:${(r.pct / maxP * 100).toFixed(1)}%"></div></div>
      <div class="pct">${r.pct.toFixed(1)}%</div>
    </div>`).join("");

  function movers(list, n) {
    return list.slice(0, n).map(p => `
      <div class="mv"><span class="s">${esc(p.symbol)}</span>${signed(p.unrealizedPnlBase, "full")}</div>`).join("");
  }
  document.getElementById("gainers").innerHTML = movers(D.topGainers, 3);
  document.getElementById("losers").innerHTML = movers(D.topLosers, 3);

  document.getElementById("posSummary").textContent = `全部持倉 · ${D.meta.positionCount}`;
  document.getElementById("tbody").innerHTML = D.positions.map(p => `
    <tr>
      <td><div class="sym">${esc(p.symbol)}</div><span class="desc">${esc(p.description)}</span></td>
      <td>${money(p.quantity, "qty")}</td>
      <td>${money(p.marketValue, "full")}<div class="desc">${esc(p.currency)}</div></td>
      <td class="${p.unrealizedPnl > 0 ? "pos" : p.unrealizedPnl < 0 ? "neg" : ""}">${(p.unrealizedPnl > 0 ? "+" : "") + money(p.unrealizedPnl, "full")}</td>
      <td>${p.weightPct.toFixed(1)}</td>
    </tr>`).join("");

  document.getElementById("foot").textContent =
    `Flex 日結 · 只讀 · 產生 ${D.meta.whenGenerated}`;
})();
</script>
</body>
